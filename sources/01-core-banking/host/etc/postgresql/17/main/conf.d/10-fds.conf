# ---------- Connections & security ----------
listen_addresses = 'localhost,10.101.10.10'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/postgresql/17/main/tls/server.crt'
ssl_key_file  = '/etc/postgresql/17/main/tls/server.key'
ssl_ca_file   = '/etc/postgresql/17/main/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
idle_in_transaction_session_timeout = '10min'
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ---------- Memory (t4g.large, 8GB) ----------
shared_buffers = 2GB
huge_pages = try
effective_cache_size = 6GB
work_mem = 8MB
maintenance_work_mem = 512MB

# ---------- WAL & CDC ----------
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
max_slot_wal_keep_size = 8GB
wal_sender_timeout = 60s
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ---------- Archive ----------
archive_mode = on
archive_command = '/bin/true'
archive_timeout = 15min

# ---------- Planner / IO ----------
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------- Autovacuum ----------
autovacuum_max_workers = 3
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# ---------- Timezone ----------
timezone = 'UTC'
log_timezone = 'UTC'

# ---------- Logging ----------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
log_file_mode = 0640
log_line_prefix = '%m [%p] %q%u@%d/%a from %h '
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_autovacuum_min_duration = 1s
log_temp_files = 0
log_replication_commands = on

# ---------- Extensions ----------
shared_preload_libraries = 'pg_stat_statements,pgaudit'
pg_stat_statements.track = all
track_io_timing = on
pgaudit.log = 'ddl,role'
pgaudit.log_catalog = off
pgaudit.log_parameter = off
